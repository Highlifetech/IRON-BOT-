name: Shipment Summary

on:
  schedule:
    # 1:00 PM ET = 18:00 UTC.
    # Only the midday slot: ShipBot posts its own card into this same chat at
    # 8am and 8pm, so running then put two shipment reports side by side.
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  post-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post the shipment summary
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_URL: ${{ secrets.LARK_BASE_URL }}
          LARK_CHAT_ID_HLT_INBOUND: ${{ secrets.LARK_CHAT_ID_HLT_INBOUND }}
          # The numbers come from ShipBot now, not a Lark Base table.
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: python shipment_tracker.py
