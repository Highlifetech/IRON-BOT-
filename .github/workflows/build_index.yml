name: Build RAG Index

# Rebuilds the Lark knowledge index and commits it back to the repo.
# Railway auto-deploys on push, so a fresh index ships to the bot automatically.

on:
  schedule:
    # 5:00 AM EST (10:00 UTC) daily -- before the morning digest.
    - cron: '0 10 * * *'
  workflow_dispatch:  # manual "Run workflow" button
    inputs:
      force:
        description: 'Re-index everything (ignore content-hash skips)'
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the rebuilt index

concurrency:
  group: rag-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR engine (for scanned PDFs / images)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-rag.txt

      - name: Build index
        env:
          # Lark (reuse the secrets the other workflows already use)
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_URL: ${{ secrets.LARK_BASE_URL }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_TENANT_DOMAIN: ${{ secrets.LARK_TENANT_DOMAIN }}
          # Embeddings -- set ONE of these as a repo secret.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Ingest large mockups / tech-pack PDFs / images (up to 100MB).
          RAG_MAX_ATTACHMENT_MB: "100"
        run: |
          python -m rag.ingest ${{ inputs.force && '--force' || '' }}

      - name: Commit updated index
        run: |
          git config user.name "iron-bot-indexer"
          git config user.email "actions@users.noreply.github.com"
          git add rag_index/
          if git diff --cached --quiet; then
            echo "Index unchanged -- nothing to commit."
            exit 0
          fi
          git commit -m "chore(rag): rebuild Lark index [skip ci]"
          # main may have moved since checkout; sync-before-push with retries so
          # a concurrent commit doesn't reject our index push.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "index pushed"; exit 0
            fi
            echo "push rejected; rebasing on latest main and retrying ($i)..."
            git pull --rebase -X ours origin main || git rebase --abort
            sleep $((RANDOM % 5 + 3))
          done
          echo "could not push index after retries"; exit 1
